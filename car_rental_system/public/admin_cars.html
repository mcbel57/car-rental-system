<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Control | Makbel Car Rentals Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl relative z-20">
            <div class="p-8 flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Makbel Car Rentals <span class="text-indigo-500">HQ</span></h1>
            </div>

            
            <nav class="flex-1 px-4 space-y-1.5 mt-4 overflow-y-auto custom-scrollbar">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management</div>
                <a href="admin_customers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-users text-lg"></i>
                    <span>Customer Directory</span>
                </a>

                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl bg-indigo-600/10 text-indigo-400 font-bold border border-indigo-500/20 transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>


            <div class="p-6">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center space-x-3 py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all border border-red-500/20 active:scale-95">
                    <i class="fas fa-link-slash"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- 🏎️ Main Fleet Management -->
        <main class="flex-1 overflow-y-auto bg-slate-50 relative">
            <header
                class="sticky top-0 glass z-10 px-10 py-6 flex justify-between items-center border-b border-slate-200/50">
                <div class="animate-fade-in">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Fleet <span
                            class="text-indigo-600">Inventory</span></h2>
                </div>
                <a href="admin_manage_cars.html"
                    class="btn-premium px-6 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-indigo-100 flex items-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>Add Vehicle</span>
                </a>
            </header>

            <div class="px-10 py-10 animate-fade-in">
                <div class="glass rounded-[2rem] overflow-hidden border-slate-100 shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/5 text-slate-500 uppercase text-[10px] font-black tracking-widest">
                                <th class="px-8 py-5">Vehicle Details</th>
                                <th class="px-8 py-5">Classification</th>
                                <th class="px-8 py-5">Revenue model</th>
                                <th class="px-8 py-5 text-center">Operations</th>
                            </tr>
                        </thead>
                        <tbody id="carTableBody" class="divide-y divide-slate-100">
                            <!-- Loading state -->
                            <tr>
                                <td colspan="4" class="px-8 py-20 text-center">
                                    <div class="flex flex-col items-center justify-center space-y-3">
                                        <i class="fas fa-circle-notch fa-spin text-indigo-500 text-3xl"></i>
                                        <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">
                                            Scanning Fleet...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            Toast.success("Session closed");
            setTimeout(() => window.location.href = "login.html", 1000);
        });

        async function fetchCars() {
            try {
                const response = await fetch("/api/cars", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Connection failed");

                const data = await response.json();
                if (data.success && Array.isArray(data.cars)) {
                    renderCars(data.cars);
                }
            } catch (error) {
                console.error("Fleet Sync Error:", error);
                Toast.error("Inventory sync failed");
                document.getElementById("carTableBody").innerHTML = `<tr><td colspan="4" class="py-20 text-center text-red-400 font-bold">Failed to load inventory.</td></tr>`;
            }
        }

        function renderCars(cars) {
            const body = document.getElementById("carTableBody");
            if (cars.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="py-20 text-center text-slate-400 font-bold">No vehicles in inventory.</td></tr>`;
                return;
            }

            body.innerHTML = cars.map(car => `
                <tr class="group hover:bg-slate-50/50 transition-colors">
                    <td class="px-8 py-6">
                        <div class="flex items-center space-x-5">
                            <div class="w-20 h-20 rounded-2xl overflow-hidden shadow-inner bg-slate-100 flex-shrink-0">
                                <img src="${car.image || ''}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            </div>
                            <div>
                                <h4 class="text-lg font-bold text-slate-800">${car.carName}</h4>
                                <p class="text-xs text-slate-400 font-medium line-clamp-1 max-w-[200px]">${car.description}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        <div class="space-y-1">
                            <span class="px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded text-[9px] font-black uppercase tracking-widest border border-indigo-100">${car.vehicleType}</span>
                            <p class="text-xs text-slate-500 font-bold ml-1">${car.color}</p>
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        <div class="space-y-0.5">
                            <p class="text-sm font-black text-slate-800">Ksh ${car.costPerDay}<span class="text-[10px] text-slate-400 font-bold">/day</span></p>
                            <p class="text-[10px] text-slate-300 font-bold uppercase tracking-wider">Rental Only</p>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-center">
                        <div class="flex items-center justify-center space-x-2">
                            <button onclick="window.location.href='admin_manage_cars.html?id=${car.id}'" class="w-10 h-10 bg-slate-100 text-slate-400 rounded-xl hover:bg-indigo-600 hover:text-white transition-all"><i class="fas fa-pen text-xs"></i></button>
                            <button onclick="deleteCar(${car.id})" class="w-10 h-10 bg-slate-100 text-slate-400 rounded-xl hover:bg-red-500 hover:text-white transition-all"><i class="fas fa-trash-can text-xs"></i></button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }

        async function deleteCar(carId) {
            if (!confirm("Permanently deauthorize and remove this vehicle from inventory?")) return;

            try {
                const response = await fetch(`/api/cars/${carId}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    Toast.success("Vehicle deleted successfully");
                    fetchCars();
                } else {
                    const data = await response.json();
                    Toast.error(data.error || data.message || "Deauthorization failed");
                }
            } catch (error) {
                Toast.error("delete error: " + error.message);
            }
        }

        fetchCars();
    </script>

</body>

</html>
