<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Drivers | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

    <!-- 🌍 Admin Header -->
    <header class="bg-blue-800 text-white py-4 shadow-lg fixed top-0 w-full z-10">
        <div class="container mx-auto flex justify-between items-center px-6">
            <h1 class="text-2xl font-bold">Admin Dashboard</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="admin_dashboard.html" class="hover:text-gray-300">Dashboard</a></li>
                    <li><a href="admin_manage_cars.html" class="hover:text-gray-300">Add Cars</a></li>
                    <li><a href="admin_cars.html" class="hover:text-gray-300">Manage Cars</a></li>
                    <li><a href="admin_view_leases.html" class="hover:text-gray-300">Manage Leases</a></li>
                    <li><a href="admin_driver_management.html" class="hover:text-gray-300">Manage Drivers</a></li>
                    <li><a href="index.html" class="hover:text-gray-300">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto mt-24 px-6">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Driver Management</h2>

        <!-- Pending Applications -->
        <section class="mb-10">
            <h3 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">Pending Driver Applications</h3>
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                Name
                            </th>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                Email / Phone
                            </th>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                License No.
                            </th>
                            <th
                                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTableBody">
                        <tr>
                            <td colspan="4" class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-center">
                                Loading applications...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const token = localStorage.getItem("token"); // Assuming admin token is saved here too, usually helpful to check role

        async function fetchApplications() {
            try {
                const response = await fetch("http://localhost:5000/api/leases/applications", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const drivers = await response.json();

                const tbody = document.getElementById("applicationsTableBody");
                tbody.innerHTML = "";

                if (drivers.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' class='px-5 py-5 border-b border-gray-200 bg-white text-sm text-center'>No pending applications.</td></tr>";
                    return;
                }

                drivers.forEach(driver => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <p class="text-gray-900 whitespace-no-wrap font-bold">${driver.firstName} ${driver.lastName}</p>
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <p class="text-gray-900 whitespace-no-wrap">${driver.email}</p>
                                <p class="text-gray-600 text-xs">${driver.phoneNumber}</p>
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <p class="text-gray-900 whitespace-no-wrap">${driver.licenseNumber}</p>
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                                <button onclick="updateStatus(${driver.id}, 'approved')" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-xs mr-2">Approve</button>
                                <button onclick="updateStatus(${driver.id}, 'rejected')" class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-xs">Reject</button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error fetching applications:", error);
            }
        }

        async function updateStatus(userId, status) {
            if (!confirm(`Are you sure you want to ${status} this driver?`)) return;

            try {
                const response = await fetch("http://localhost:5000/api/leases/approve-driver", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, status })
                });

                if (response.ok) {
                    alert(`Driver ${status} successfully.`);
                    fetchApplications();
                } else {
                    alert("Failed to update status.");
                }
            } catch (error) {
                console.error("Error updating status:", error);
            }
        }

        fetchApplications();
    </script>
</body>

</html>
