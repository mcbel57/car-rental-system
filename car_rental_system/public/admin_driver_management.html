<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Vetting | Makbel Car Rentals Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl relative z-20">
            <div class="p-8 flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Makbel Car Rentals <span class="text-indigo-500">HQ</span></h1>
            </div>

            <nav class="flex-1 px-4 space-y-1.5 mt-4">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management
                </div>
                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_manage_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-plus-circle text-lg"></i>
                    <span>Add New Vehicle</span>
                </a>
                <a href="admin_view_leases.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-file-contract text-lg"></i>
                    <span>Lease Pipeline</span>
                </a>
                <a href="admin_driver_management.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl bg-indigo-600/10 text-indigo-400 font-bold border border-indigo-500/20 transition-all font-semibold">
                    <i class="fas fa-id-card text-lg"></i>
                    <span>Driver Vetting</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>

            <div class="p-6">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center space-x-3 py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all border border-red-500/20 active:scale-95">
                    <i class="fas fa-link-slash"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- 🛡️ Driver Application Vetting -->
        <main class="flex-1 overflow-y-auto bg-slate-50 relative">
            <header class="sticky top-0 glass z-10 px-10 py-6 border-b border-slate-200/50">
                <div class="animate-fade-in">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Partner <span
                            class="text-indigo-600">Vetting</span></h2>
                </div>
            </header>

            <div class="px-10 py-10 animate-fade-in">
                <section class="space-y-6">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest pl-1">Pending Partner
                        Applications</h3>
                    <div class="glass rounded-[2rem] overflow-hidden border-slate-100 shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr
                                    class="bg-slate-900/5 text-slate-500 uppercase text-[10px] font-black tracking-widest text-center">
                                    <th class="px-8 py-5 text-left">Identity Profile</th>
                                    <th class="px-8 py-5 text-left">Professional Credentials</th>
                                    <th class="px-8 py-5">Command Center</th>
                                </tr>
                            </thead>
                            <tbody id="applicationsTableBody" class="divide-y divide-slate-100">
                                <tr>
                                    <td colspan="3" class="py-24 text-center">
                                        <i class="fas fa-search fa-spin text-indigo-500 text-3xl mb-4"></i>
                                        <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">
                                            Scanning Pipeline for applications...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            Toast.success("Session closed");
            setTimeout(() => window.location.href = "login.html", 1000);
        });

        async function fetchApplications() {
            try {
                const response = await fetch("/api/leases/applications", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Sync failed");

                const drivers = await response.json();
                const tbody = document.getElementById("applicationsTableBody");
                tbody.innerHTML = "";

                if (drivers.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3' class='py-20 text-center text-slate-400 font-bold'>The vetting pipeline is currently empty.</td></tr>";
                    return;
                }

                drivers.forEach(driver => {
                    tbody.innerHTML += `
                        <tr class="group hover:bg-slate-50/50 transition-colors">
                            <td class="px-8 py-7">
                                <div class="flex items-center space-x-5">
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black text-sm uppercase shadow-sm">${driver.firstName[0]}${driver.lastName[0]}</div>
                                    <div>
                                        <p class="text-base font-black text-slate-800">${driver.firstName} ${driver.lastName}</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tight">${driver.email}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-7">
                                <div class="space-y-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">License:</span>
                                        <span class="text-xs font-bold text-slate-700">${driver.licenseNumber}</span>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Contact:</span>
                                        <span class="text-xs font-bold text-slate-700">${driver.phoneNumber}</span>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-7">
                                <div class="flex items-center justify-center space-x-3">
                                    <button onclick="updateStatus(${driver.id}, 'approved')" class="px-6 py-2.5 bg-emerald-500 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-emerald-600 shadow-lg shadow-emerald-100 transition-all active:scale-95">Authorize</button>
                                    <button onclick="updateStatus(${driver.id}, 'rejected')" class="px-6 py-2.5 bg-slate-100 text-slate-400 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-rose-500 hover:text-white transition-all active:scale-95 border border-slate-200 hover:border-rose-500">Decline</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Driver Approval Error:", error);
                Toast.error("Failed to sync applications");
            }
        }

        async function updateStatus(userId, status) {
            if (!confirm(`Are you sure you want to ${status} this partner application?`)) return;

            try {
                Toast.info("Updating vetting status...");
                const response = await fetch("/api/leases/approve-driver", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, status })
                });

                if (response.ok) {
                    Toast.success(`Partner ${status} successfully.`);
                    fetchApplications();
                } else {
                    Toast.error("Status update failed");
                }
            } catch (error) {
                Toast.error(error.message);
            }
        }

        fetchApplications();
    </script>
</body>

</html>
