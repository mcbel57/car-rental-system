<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Pipeline | Makbel Car Rentals Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl relative z-20">
            <div class="p-8 flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Makbel Car Rentals <span class="text-indigo-500">HQ</span></h1>
            </div>

            <nav class="flex-1 px-4 space-y-1.5 mt-4">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management
                </div>
                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_manage_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-plus-circle text-lg"></i>
                    <span>Add New Vehicle</span>
                </a>
                <a href="admin_view_leases.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl bg-indigo-600/10 text-indigo-400 font-bold border border-indigo-500/20 transition-all font-semibold">
                    <i class="fas fa-file-contract text-lg"></i>
                    <span>Lease Pipeline</span>
                </a>
                <a href="admin_verifications.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-id-card text-lg"></i>
                    <span>Driver Vetting</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>

            <div class="p-6">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center space-x-3 py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all border border-red-500/20 active:scale-95">
                    <i class="fas fa-link-slash"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- 📄 Lease Management -->
        <main class="flex-1 overflow-y-auto bg-slate-50 relative">
            <header class="sticky top-0 glass z-10 px-10 py-6 border-b border-slate-200/50">
                <div class="animate-fade-in">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Lease <span
                            class="text-indigo-600">Pipeline</span></h2>
                </div>
            </header>

            <div class="px-10 py-10 animate-fade-in">
                <div class="glass rounded-[2rem] overflow-hidden border-slate-100 shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-slate-900/5 text-slate-500 uppercase text-[10px] font-black tracking-widest text-center">
                                <th class="px-8 py-5 text-left">Driver Entity</th>
                                <th class="px-8 py-5 text-left">Asset Details</th>
                                <th class="px-8 py-5">Weekly Yield</th>
                                <th class="px-8 py-5">Pipeline Status</th>
                                <th class="px-8 py-5">Command</th>
                            </tr>
                        </thead>
                        <tbody id="leasesTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="5" class="py-20 text-center">
                                    <i class="fas fa-circle-notch fa-spin text-indigo-500 text-3xl mb-4"></i>
                                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">Syncing
                                        Pipeline...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            Toast.success("Session closed");
            setTimeout(() => window.location.href = "login.html", 1000);
        });

        async function fetchLeases() {
            try {
                const response = await fetch("/api/leases/all", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Sync failed");

                const leases = await response.json();
                const tbody = document.getElementById("leasesTableBody");
                tbody.innerHTML = "";

                if (leases.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='5' class='py-20 text-center text-slate-400 font-bold'>No active leases in the pipeline.</td></tr>";
                    return;
                }

                leases.forEach(lease => {
                    const driverName = lease.Driver ? `${lease.Driver.firstName} ${lease.Driver.lastName}` : "Unknown Driver";
                    const carName = lease.Car ? lease.Car.carName : "External Asset";

                    let statusClass = "bg-slate-100 text-slate-500";
                    if (lease.status === "pending") statusClass = "bg-amber-50 text-amber-600 border-amber-200";
                    if (lease.status === "active") statusClass = "bg-emerald-50 text-emerald-600 border-emerald-200";
                    if (lease.status === "terminated") statusClass = "bg-rose-50 text-rose-600 border-rose-200";

                    let actions = '<span class="text-slate-300 text-xs italic">Read Only</span>';
                    if (lease.status === "pending") {
                        actions = `
                            <div class="flex items-center justify-center space-x-2">
                                <button onclick="updateLeaseStatus(${lease.id}, 'active')" class="w-9 h-9 bg-emerald-100 text-emerald-600 rounded-xl hover:bg-emerald-600 hover:text-white transition-all" title="Authorize"><i class="fas fa-check"></i></button>
                                <button onclick="updateLeaseStatus(${lease.id}, 'terminated')" class="w-9 h-9 bg-rose-100 text-rose-600 rounded-xl hover:bg-rose-600 hover:text-white transition-all" title="Decline"><i class="fas fa-xmark"></i></button>
                            </div>
                        `;
                    } else if (lease.status === "active") {
                        actions = `
                            <button onclick="updateLeaseStatus(${lease.id}, 'ended')" class="px-4 py-1.5 bg-slate-900 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-600 transition-all">Terminate</button>
                        `;
                    }

                    tbody.innerHTML += `
                        <tr class="group hover:bg-slate-50/50 transition-colors">
                            <td class="px-8 py-6">
                                <div class="flex items-center space-x-4">
                                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center font-bold text-xs uppercase">${lease.Driver ? lease.Driver.firstName[0] : '?'}</div>
                                    <div>
                                        <p class="text-sm font-black text-slate-800">${driverName}</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tight">${lease.Driver ? lease.Driver.email : ""}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-6">
                                <div class="space-y-0.5">
                                    <p class="text-sm font-bold text-slate-800">${carName}</p>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Commenced: ${lease.startDate}</p>
                                </div>
                            </td>
                            <td class="px-8 py-6 text-center">
                                <p class="text-sm font-black text-indigo-600 leading-none">Ksh ${lease.weeklyCost}</p>
                                <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">per week</p>
                            </td>
                            <td class="px-8 py-6 text-center">
                                <span class="px-3 py-1 text-[10px] font-black uppercase tracking-widest rounded-full border ${statusClass}">
                                    ${lease.status}
                                </span>
                            </td>
                            <td class="px-8 py-6 text-center">
                                ${actions}
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Lease Sync Error:", error);
                Toast.error("Resource fetch failed");
            }
        }

        async function updateLeaseStatus(leaseId, status) {
            if (!confirm(`Are you sure you want to transition this contract to ${status}?`)) return;

            try {
                Toast.info("Updating pipeline...");
                const response = await fetch("/api/leases/approve-lease", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ leaseId, status })
                });

                if (response.ok) {
                    Toast.success(`Contract successfully set to ${status}`);
                    fetchLeases();
                } else {
                    Toast.error("Pipeline update failed");
                }
            } catch (error) {
                Toast.error(error.message);
            }
        }

        fetchLeases();
    </script>
</body>

</html>
