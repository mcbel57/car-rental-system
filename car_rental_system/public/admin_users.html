<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- 🌍 Admin Header -->
    <header class="bg-blue-800 text-white py-4 shadow-lg fixed top-0 w-full z-10">
        <div class="container mx-auto flex justify-between items-center px-6">
            <h1 class="text-2xl font-bold">Manage Users</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="admin_dashboard.html" class="hover:text-gray-300">Dashboard</a></li>
                    <li><a href="admin_manage_cars.html" class="hover:text-gray-300">Add Cars</a></li>
                    <li><a href="admin_cars.html" class="hover:text-gray-300">Manage Cars</a></li>
                    <li><a href="admin_view_rentals.html" class="hover:text-gray-300">View Rentals</a></li>
                    <li><a href="admin_users.html" class="hover:text-gray-300">Manage Users</a></li>
                    <li><a href="index.html" class="hover:text-gray-300">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 📌 Users Table -->
    <main class="container mx-auto mt-20 px-6">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Registered Users</h2>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <table class="w-full border-collapse border border-gray-300">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="border border-gray-300 px-4 py-2">ID</th>
                        <th class="border border-gray-300 px-4 py-2">Name</th>
                        <th class="border border-gray-300 px-4 py-2">Email</th>
                        <th class="border border-gray-300 px-4 py-2">Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Users will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("You need to log in first!");
                window.location.href = "login.html";
                return;
            }

            try {
                // Fetch all users from backend
                const response = await fetch("http://localhost:5000/api/admin/users", {
                    method: "GET",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) {
                    alert("Error fetching users.");
                    return;
                }

                const users = await response.json();
                const userTableBody = document.getElementById("userTableBody");

                // Loop through users and create table rows
                users.forEach(user => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td class="border border-gray-300 px-4 py-2">${user.id}</td>
                        <td class="border border-gray-300 px-4 py-2">${user.firstName} ${user.lastName}</td>
                        <td class="border border-gray-300 px-4 py-2">${user.email}</td>
                        <td class="border border-gray-300 px-4 py-2 text-center">
                            <button class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-700"
                                onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    `;
                    userTableBody.appendChild(row);
                });

            } catch (error) {
                console.error("Error fetching users:", error);
            }
        });

        // Function to delete user
        async function deleteUser(userId) {
            if (!confirm("Are you sure you want to delete this user?")) return;

            const token = localStorage.getItem("token");

            try {
                const response = await fetch(`http://localhost:5000/api/admin/users/${userId}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) {
                    alert("Failed to delete user.");
                    return;
                }

                alert("User deleted successfully!");
                location.reload(); // Refresh the page to update the table
            } catch (error) {
                console.error("Error deleting user:", error);
            }
        }
    </script>

</body>

</html>
