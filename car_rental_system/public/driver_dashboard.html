<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard | Car Rental System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 font-sans">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6 text-2xl font-bold bg-gray-800 text-center border-b border-gray-700">
                Driver Panel
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block py-3 px-4 rounded hover:bg-gray-700 transition flex items-center">
                    <i class="fas fa-home mr-3"></i> Dashboard
                </a>
                <a href="index.html" class="block py-3 px-4 rounded hover:bg-gray-700 transition flex items-center">
                    <i class="fas fa-home mr-3"></i> Home
                </a>
                <button id="logoutBtn"
                    class="w-full text-left py-3 px-4 rounded hover:bg-red-600 transition flex items-center mt-10">
                    <i class="fas fa-sign-out-alt mr-3"></i> Logout
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Header -->
            <header class="bg-white shadow p-6 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Welcome, <span id="driverName">Driver</span>!</h2>
                <div class="text-gray-600" id="currentDate"></div>
            </header>

            <div class="p-8">
                <!-- Status Alert -->
                <div id="statusAlert" class="hidden mb-6 p-4 rounded-lg"></div>

                <!-- Active Lease Section -->
                <section class="mb-10">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">My Active Lease</h3>
                    <div id="activeLeaseContainer"
                        class="bg-white p-6 rounded-lg shadow-md min-h-[150px] flex items-center justify-center text-gray-500">
                        <span class="loading-text">Loading lease details...</span>
                    </div>
                </section>

                <!-- Available Cars for Lease Section -->
                <section>
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Available Cars for Taxi Lease</h3>
                    <div id="carsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Cards will be injected here -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        document.getElementById("currentDate").innerText = new Date().toLocaleDateString();

        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        if (!token || !user) {
            window.location.href = "login.html";
        } else if (user.role === "admin") {
            window.location.href = "admin_dashboard.html";
        } else if (user.role === "user") {
            window.location.href = "user_dashboard.html";
        }

        document.getElementById("driverName").innerText = user.firstName;

        // 🔔 Display Notifications
        if (user.notification) {
            const statusAlert = document.getElementById("statusAlert");
            statusAlert.innerText = user.notification;
            statusAlert.classList.remove("hidden");
            statusAlert.classList.add("bg-blue-100", "text-blue-800", "border", "border-blue-200", "block");
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "login.html";
        });

        async function fetchDashboardData() {
            try {
                // 1. Check Lease Status
                const leaseRes = await fetch("http://localhost:5000/api/leases/my-lease", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const activeLeaseContainer = document.getElementById("activeLeaseContainer");

                if (leaseRes.ok) {
                    const lease = await leaseRes.json();
                    if (lease) {
                        activeLeaseContainer.innerHTML = `
                            <div class="text-left w-full">
                                <h4 class="text-lg font-bold text-blue-800 mb-2">${lease.Car ? lease.Car.carName : 'Car leased'}</h4>
                                <p class="text-gray-700"><strong>Start Date:</strong> ${lease.startDate}</p>
                                <p class="text-gray-700"><strong>Weekly Cost:</strong> Ksh ${lease.weeklyCost}</p>
                                <p class="text-green-600 font-bold mt-2">Status: ${lease.status.toUpperCase()}</p>
                            </div>
                        `;
                    } else {
                        activeLeaseContainer.innerHTML = "<p>No active lease found.</p>";
                    }
                } else {
                    activeLeaseContainer.innerHTML = "<p>You are not currently approved as a driver or have no active lease.</p>";
                }

                // 2. Fetch Available Cars
                const carsRes = await fetch("/api/cars");
                const carsData = await carsRes.json();
                const allCars = carsData.cars || [];

                const leasableCars = allCars.filter(car => car.isAvailableForLease);
                const carsGrid = document.getElementById("carsGrid");

                if (leasableCars.length === 0) {
                    carsGrid.innerHTML = "<p class='col-span-3 text-center text-gray-500'>No cars available for lease at the moment.</p>";
                } else {
                    carsGrid.innerHTML = leasableCars.map(car => `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                            <img src="${car.image || 'https://via.placeholder.com/300'}" alt="${car.carName}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <h3 class="text-lg font-bold text-gray-800">${car.carName}</h3>
                                <p class="text-sm text-gray-600 mt-1">${car.vehicleType} | ${car.color}</p>
                                <p class="text-blue-600 font-bold text-xl mt-3">Ksh ${car.weeklyLeaseCost} <span class="text-sm text-gray-500">/ week</span></p>
                                <button onclick="leaseCar(${car.id})" class="w-full bg-blue-600 text-white py-2 rounded mt-4 hover:bg-blue-700 font-bold transition">
                                    Apply to Lease
                                </button>
                            </div>
                        </div>
                    `).join("");
                }

            } catch (error) {
                console.error("Error fetching dashboard data:", error);
            }
        }

        async function leaseCar(carId) {
            if (!confirm("Are you sure you want to lease this car?")) return;

            try {
                const response = await fetch("http://localhost:5000/api/leases/create", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ carId })
                });

                const data = await response.json();
                if (response.ok) {
                    alert("Lease created successfully!");
                    location.reload();
                } else {
                    alert("Failed to lease car: " + (data.error || "Unknown error"));
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        fetchDashboardData();
    </script>
</body>

</html>
