<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Car Rental System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- 🚗 Fixed Header -->
    <header class="bg-blue-700 text-white fixed top-0 left-0 w-full shadow-lg z-10">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">Car Rental</a>
            <nav>

                <a href="user_form.html" class="px-4 hover:underline">Sign Up</a>
                <a href="login.html" class="px-4 hover:underline">Sign In</a>
            </nav>
        </div>
    </header>

    <!-- 🚀 Partner/Customer Choice Header -->
    <div class="pt-24 flex items-center justify-center min-h-screen">
        <div class="bg-white shadow-lg rounded-lg p-8 max-w-md w-full">
            <h2 class="text-3xl font-bold text-center text-blue-700 mb-2">Customer Sign Up</h2>
            <p class="text-center text-gray-600 mb-6 text-sm">Create an account to browse and rent cars.</p>

            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
                <p class="text-xs text-blue-800">Want to earn with us? <a href="driver_register.html"
                        class="font-bold underline">Apply as a Driver Partner</a> instead.</p>
            </div>
            <form id="registrationForm" enctype="multipart/form-data">
                <div class="mb-4">
                    <label class="block text-gray-700">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700">ID Number</label>
                    <input type="text" id="idNumber" name="idNumber" placeholder="Enter your ID number" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter a secure password" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700">Confirm Password</label>
                    <input type="password" name="confirmPassword" id="confirmPassword"
                        placeholder="Confirm your password" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold mt-4 hover:bg-blue-700">
                    Sign Up
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // Prevent default form submission

            const formData = new FormData(event.target);
            const jsonData = {};
            formData.forEach((value, key) => {
                jsonData[key] = value;
            });

            // ✅ Assign role automatically based on email
            jsonData.role = jsonData.email.endsWith("@rentify.com") ? "admin" : "user";

            try {
                console.log("🚀 Sending Request:", jsonData);

                const response = await fetch("http://localhost:5000/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(jsonData),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to register user");
                }

                alert("Registration successful! Redirecting to dashboard...");
                window.location.href = jsonData.role === "admin" ? "admin_dashboard.html" : "user_dashboard.html";

            } catch (error) {
                console.error("❌ Error:", error);
                alert(error.message);
            }
        });
    </script>




</body>

</html>
