<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Drivers | Makbel Car Rentals Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl relative z-20">
            <div class="p-8 flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Makbel Car Rentals <span class="text-indigo-500">HQ</span></h1>
            </div>

            
            <nav class="flex-1 px-4 space-y-1.5 mt-4 overflow-y-auto custom-scrollbar">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management</div>
                <a href="admin_customers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-users text-lg"></i>
                    <span>Customer Directory</span>
                </a>
                <a href="admin_drivers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl bg-indigo-600/10 text-indigo-400 font-bold border border-indigo-500/20 transition-all font-semibold">
                    <i class="fas fa-user-tie text-lg"></i>
                    <span>Approved Drivers</span>
                </a>
                <a href="admin_driver_management.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-id-card text-lg"></i>
                    <span>Driver Vetting</span>
                </a>
                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>


            <div class="p-6">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center space-x-3 py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all border border-red-500/20 active:scale-95">
                    <i class="fas fa-link-slash"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- 👥 Approved Drivers -->
        <main class="flex-1 overflow-y-auto bg-slate-50 relative">
            <header class="sticky top-0 glass z-10 px-10 py-6 border-b border-slate-200/50">
                <div class="animate-fade-in">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Driver <span
                            class="text-indigo-600">Directory</span></h2>
                </div>
            </header>

            <div class="px-10 py-10 animate-fade-in">
                <div class="glass rounded-[2rem] overflow-hidden border-slate-100 shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-slate-900/5 text-slate-500 uppercase text-[10px] font-black tracking-widest text-center">
                                <th class="px-8 py-5 text-left">Internal ID</th>
                                <th class="px-8 py-5 text-left">Legal Name</th>
                                <th class="px-8 py-5 text-left">Secure Access</th>
                                <th class="px-8 py-5">Privileges</th>
                                <th class="px-8 py-5">Commands</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="5" class="py-24 text-center">
                                    <i class="fas fa-users-viewfinder fa-spin text-indigo-500 text-3xl mb-4"></i>
                                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">Scanning
                                        Identity Database...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            Toast.success("Session closed");
            setTimeout(() => window.location.href = "login.html", 1000);
        });

        async function fetchUsers() {
            try {
                const response = await fetch("/api/admin/drivers", {
                    method: "GET",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) throw new Error("Sync failed");

                const users = await response.json();
                renderUsers(users);
            } catch (error) {
                console.error("Approved Drivers Sync Error:", error);
                Toast.error("Identity synchronization failed");
            }
        }

        function renderUsers(users) {
            const body = document.getElementById("userTableBody");
            if (users.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="py-20 text-center text-slate-400 font-bold">No registered identities found.</td></tr>`;
                return;
            }

            body.innerHTML = users.map(u => `
                <tr class="group hover:bg-slate-50/50 transition-colors">
                    <td class="px-8 py-6">
                        <span class="px-3 py-1 bg-slate-100 text-slate-500 rounded-lg text-xs font-bold font-mono tracking-tighter">#${u.id}</span>
                    </td>
                    <td class="px-8 py-6">
                        <div class="flex items-center space-x-4">
                            <div class="w-9 h-9 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-black text-xs uppercase">${u.firstName[0]}</div>
                            <p class="text-sm font-black text-slate-800">${u.firstName} ${u.lastName}</p>
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        <p class="text-[11px] font-bold text-slate-500 tracking-tight">${u.email}</p>
                    </td>
                    <td class="px-8 py-6 text-center">
                        <span class="px-2.5 py-1 ${u.role === 'admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-500'} rounded-full text-[9px] font-black uppercase tracking-widest border border-current opacity-80">${u.role}</span>
                    </td>
                    <td class="px-8 py-6 text-center">
                        <button onclick="deleteUser(${u.id})" class="w-9 h-9 bg-rose-50 text-rose-500 rounded-xl hover:bg-rose-500 hover:text-white transition-all active:scale-95 border border-rose-100 hover:border-rose-500"><i class="fas fa-user-minus text-xs"></i></button>
                    </td>
                </tr>
            `).join("");
        }

        async function deleteUser(userId) {
            if (!confirm("Permanently deauthorize and delete this user identity? This action is IRREVERSIBLE.")) return;

            try {
                Toast.info("Executing deauthorization...");
                const response = await fetch(`/api/admin/drivers/${userId}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (response.ok) {
                    Toast.success("Identity deleted successfully");
                    fetchUsers();
                } else {
                    Toast.error("Deauthorization failed");
                }
            } catch (error) {
                Toast.error(error.message);
            }
        }

        fetchUsers();
    </script>

</body>

</html>
