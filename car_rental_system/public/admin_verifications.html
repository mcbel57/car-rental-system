<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Verification | Makbel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>

</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex">
        <!-- Sidebar placeholder -->
        <aside class="w-64 bg-indigo-900 min-h-screen p-6 text-white fixed">
            <h1 class="text-xl font-bold mb-10 flex items-center gap-2">
                <i class="fas fa-shield-alt"></i> admin.rentify
            </h1>
            
            <nav class="flex-1 px-4 space-y-1.5 mt-4 overflow-y-auto custom-scrollbar">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management</div>
                <a href="admin_customers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-users text-lg"></i>
                    <span>Customer Directory</span>
                </a>

                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="ml-64 flex-1 p-10">
            <header class="mb-10">
                <h2 class="text-3xl font-bold text-slate-800">Pending Driver Applications</h2>
                <p class="text-slate-500 italic">Review uploaded documents and AI flags to approve partners.</p>
            </header>

            <div id="loading" class="flex justify-center p-20">
                <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-600"></i>
            </div>

            <div id="noData" class="hidden bg-white p-16 rounded-[2rem] text-center shadow-sm border border-slate-100">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-check text-slate-400 text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">All clear!</h3>
                <p class="text-slate-500">There are no pending driver applications to review.</p>
            </div>

            <div id="driversGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <!-- Data injected here -->
            </div>
        </main>
    </div>

    <!-- Modal for Image Preview -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-10">
        <button onclick="closeModal()" class="absolute top-10 right-10 text-white text-4xl hover:text-indigo-400 transition-all">
            <i class="fas fa-times"></i>
        </button>
        <img id="modalImg" src="" class="max-w-full max-h-full rounded-lg shadow-2xl">
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        async function fetchPendingDrivers() {
            try {
                const response = await fetch("/api/admin/pending-drivers", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    localStorage.clear();
                    window.location.href = "login.html";
                    return;
                }

                if (!response.ok) throw new Error("Failed to fetch drivers");

                const drivers = await response.json();
                
                document.getElementById("loading").classList.add("hidden");
                
                if (drivers.length === 0) {
                    document.getElementById("noData").classList.remove("hidden");
                } else {
                    renderDrivers(drivers);
                }
            } catch (err) {
                console.error(err);
                Toast.error("Failed to load applicants");
            }
        }

        function renderDrivers(drivers) {
            const grid = document.getElementById("driversGrid");
            grid.innerHTML = drivers.map(driver => {
                const flagStr = driver.ocrFlag?.replace(' ', '') || 'NotFound';
                let flagClasses = "bg-red-100 text-red-700 border-red-200";
                if (flagStr === 'Legitimate') flagClasses = "bg-green-100 text-green-700 border-green-200";
                else if (flagStr === 'Suspicious') flagClasses = "bg-amber-100 text-amber-700 border-amber-200";
                
                return `
                <div id="driver-${driver.id}" class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 hover:shadow-md transition-all">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="text-2xl font-bold text-slate-800">${driver.firstName} ${driver.lastName}</h3>
                            <p class="text-slate-500">${driver.email} • ${driver.phoneNumber || 'No Phone'}</p>
                        </div>
                        <span class="px-4 py-1.5 rounded-full text-xs font-bold border ${flagClasses}">
                            AI FLAG: ${driver.ocrFlag || 'PENDING'}
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-6 mb-8">
                        <div class="space-y-4">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">National ID</label>
                                <span class="font-bold text-slate-700">${driver.idNumber}</span>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">License Number</label>
                                <span class="font-bold text-slate-700">${driver.licenseNumber}</span>
                            </div>
                            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                                <label class="text-[10px] font-bold text-indigo-400 uppercase block mb-1">OCR Analysis Summary</label>
                                <p class="text-xs text-indigo-700 line-clamp-4 italic">
                                    "${driver.verificationNotes || 'No text extracted.'}"
                                </p>
                            </div>
                        </div>

                        <div class="relative group cursor-zoom-in" onclick="openModal('${driver.licensePhoto}')">
                            <img src="${driver.licensePhoto}" alt="License" class="w-full h-full object-cover rounded-2xl border border-slate-200">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all rounded-2xl flex items-center justify-center">
                                <i class="fas fa-search-plus text-white text-3xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="updateStatus(${driver.id}, 'approved')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-indigo-100 active:scale-95">
                            Approve Driver
                        </button>
                        <button onclick="updateStatus(${driver.id}, 'rejected')" class="flex-1 bg-white border border-slate-200 hover:bg-red-50 hover:border-red-200 text-slate-600 hover:text-red-600 font-bold py-3.5 rounded-2xl transition-all active:scale-95">
                            Reject
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        async function updateStatus(userId, status) {
            if (!confirm(`Are you sure you want to ${status} this driver?`)) return;

            try {
                const response = await fetch("/api/admin/verify-driver", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, status })
                });

                if (response.ok) {
                    Toast.success(`Driver ${status} successfully!`);
                    document.getElementById(`driver-${userId}`).classList.add('opacity-0', 'scale-90');
                    setTimeout(() => {
                        document.getElementById(`driver-${userId}`).remove();
                        if (document.getElementById("driversGrid").children.length === 0) {
                            document.getElementById("noData").classList.remove("hidden");
                        }
                    }, 500);
                } else {
                    Toast.error("Action failed");
                }
            } catch (err) {
                Toast.error("Connection error");
            }
        }

        function openModal(src) {
            document.getElementById("modalImg").src = src;
            document.getElementById("imageModal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("imageModal").classList.add("hidden");
        }

        fetchPendingDrivers();
    </script>
</body>
</html>
