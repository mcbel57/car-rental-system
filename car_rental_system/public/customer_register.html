<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Makbel Car Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 min-h-screen">

    <!-- 🚀 Navigation Bar -->
    <header class="glass fixed top-0 left-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="flex items-center space-x-2">
                    <div
                        class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12">
                        <i class="fas fa-car text-white"></i>
                    </div>
                    <span
                        class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">Makbel Car Rentals</span>
                </a>
            </div>
            <nav class="flex space-x-6 text-slate-600 font-semibold text-sm">
                <a href="customer_register.html" class="text-indigo-600">Sign Up</a>
                <a href="login.html" class="hover:text-indigo-600 transition-colors">Sign In</a>
            </nav>
        </div>
    </header>

    <!-- 🚀 Partner/Customer Choice Header -->
    <div class="pt-32 pb-16 flex items-center justify-center">
        <div class="glass p-10 max-w-lg w-full rounded-[2.5rem] animate-fade-in border-indigo-50 mx-4">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-bold text-slate-900 mb-2 tracking-tight">Join Us</h2>
                <p class="text-slate-500">The journey of a thousand miles starts here</p>
            </div>



            <form id="registrationForm" class="space-y-5">
                <div class="grid grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">First Name</label>
                        <input type="text" name="firstName" placeholder="John" required
                            class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Last Name</label>
                        <input type="text" name="lastName" placeholder="Doe" required
                            class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Email Address</label>
                    <input type="email" name="email" placeholder="john@example.com" required
                        class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Phone</label>
                        <input type="tel" name="phoneNumber" placeholder="+254..." required
                            class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">ID Number</label>
                        <input type="text" name="idNumber" placeholder="12345678" required
                            class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Password</label>
                        <input type="password" name="password" placeholder="••••••••" required
                            class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Confirm</label>
                        <input type="password" name="confirmPassword" placeholder="••••••••" required
                            class="w-full px-5 py-3.5 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none shadow-sm">
                    </div>
                </div>

                <button type="submit"
                    class="w-full btn-premium py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all mt-6 text-lg">
                    Create Account
                </button>

                <p class="text-center text-sm text-slate-500 mt-8">
                    Already a member?
                    <a href="login.html"
                        class="text-indigo-600 font-bold hover:underline decoration-2 underline-offset-4">Sign In</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const jsonData = {};
            formData.forEach((value, key) => {
                jsonData[key] = value;
            });

            if (jsonData.password !== jsonData.confirmPassword) {
                Toast.error("Passwords do not match");
                return;
            }

            jsonData.role = jsonData.email.endsWith("@rentify.com") ? "admin" : "user";

            try {
                const submitBtn = event.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerText;
                submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Registering...';
                submitBtn.disabled = true;

                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(jsonData),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to register user");
                }

                Toast.success("Registration successful! Welcome aboard.");

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                console.error("❌ Error:", error);
                Toast.error(error.message);
                const submitBtn = event.target.querySelector('button[type="submit"]');
                submitBtn.innerText = "Create Account";
                submitBtn.disabled = false;
            }
        });
    </script>           }
        });
    </script>

</body>

</html>
