<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-700 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">User Dashboard</h1>
        <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-md hover:bg-red-700">Logout</button>
    </header>

    <div class="max-w-3xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Welcome, <span id="userName"></span></h2>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>User ID:</strong> <span id="userId"></span></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("You need to login first!");
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/api/user/dashboard", {
                    method: "GET",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) {
                    alert("Session expired. Please log in again.");
                    localStorage.removeItem("token");
                    window.location.href = "login.html";
                    return;
                }

                const data = await response.json();
                document.getElementById("userName").innerText = `User ${data.userId}`;
                document.getElementById("userId").innerText = data.userId;
                document.getElementById("userEmail").innerText = "user@example.com";
            } catch (error) {
                console.error("Error fetching user data:", error);
            }
        });

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
