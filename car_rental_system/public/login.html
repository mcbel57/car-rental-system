<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Makbel Car Rentals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <header class="glass fixed top-0 left-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="flex items-center space-x-2">
                    <div
                        class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-md transform rotate-12">
                        <i class="fas fa-car text-white text-sm"></i>
                    </div>
                    <span
                        class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">Makbel Car Rentals</span>
                </a>
            </div>
            <nav class="flex space-x-6 text-slate-600 font-semibold text-sm">
                <a href="customer_register.html" class="hover:text-indigo-600">Sign Up</a>
                <a href="login.html" class="text-indigo-600">Sign In</a>
            </nav>
        </div>
    </header>

    <div class="glass p-10 max-w-md w-full rounded-3xl animate-fade-in mx-4 border-indigo-50">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-slate-900 mb-2">Welcome Back</h2>
            <p class="text-slate-500">Sign in to manage your journey</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="space-y-2">
                <label for="email" class="block text-sm font-semibold text-slate-700 ml-1">Email Address</label>
                <div class="relative group">
                    <span
                        class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required autocomplete="off"
                        class="w-full pl-11 pr-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center ml-1">
                    <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                    <a href="#" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Forgot?</a>
                </div>
                <div class="relative group">
                    <span
                        class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full pl-11 pr-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                </div>
            </div>

            <button type="submit"
                class="w-full btn-premium py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                Sign In
            </button>

            <p class="text-center text-sm text-slate-500">
                Don't have an account?
                <a href="customer_register.html" class="text-indigo-600 font-bold hover:underline">Create one</a>
            </p>
        </form>
    </div>

    <script>
        // Force clear fields on page load to prevent browser pre-filling
        window.onload = () => {
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
        };

                // Enhanced login handling with validation and detailed error feedback
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const loginButton = document.querySelector("button[type='submit']");
            const originalText = loginButton.innerText;

            // Basic client‑side validation
            if (!email || !password) {
                Toast.error("Please provide both email and password.");
                return;
            }

            // UI feedback while authenticating
            loginButton.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Authenticating...';
            loginButton.disabled = true;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                // Attempt to parse JSON regardless of status to capture server‑provided messages
                const data = await response.json();

                if (!response.ok) {
                    // Server returned an error (e.g., invalid credentials)
                    const serverMsg = data.error || "Login failed";
                    throw new Error(serverMsg);
                }

                // Successful login – store credentials
                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify(data.user));
                Toast.success(`Welcome back, ${data.user.firstName}!`);

                // Prefer redirect query param (e.g., booking.html?carId=123)
                const urlParams = new URLSearchParams(window.location.search);
                const requestedRedirect = urlParams.get('redirect');

                if (requestedRedirect) {
                    const dest = decodeURIComponent(requestedRedirect);
                    setTimeout(() => window.location.href = dest, 800);
                    return;
                }

                // Fallback to server-provided redirectTo
                if (data.redirectTo) {
                    setTimeout(() => window.location.href = data.redirectTo, 800);
                } else {
                    Toast.warn("No redirect path provided. You are now logged in.");
                }
            } catch (error) {
                // Network error or thrown server error
                console.error("❌ Login Error:", error);
                Toast.error(error.message || "Unable to connect to server");
            } finally {
                // Always reset button UI
                loginButton.innerHTML = originalText;
                loginButton.disabled = false;
            }
        });
    </script>
</body>

</html>
