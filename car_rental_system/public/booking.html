<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Booking | Makbel Car Rentals Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 min-h-screen">

    <!-- 🚀 Premium Header -->
    <header class="glass fixed top-0 left-0 w-full z-50 border-b border-slate-200/50">
        <div class="max-w-7xl mx-auto px-6 lg:px-10 py-5 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href="user_dashboard.html" class="flex items-center space-x-2">
                    <div
                        class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12 transition-transform hover:rotate-0">
                        <i class="fas fa-car text-white"></i>
                    </div>
                    <span
                        class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600 tracking-tight">Makbel Car Rentals</span>
                </a>
            </div>

            <nav class="flex items-center space-x-8">
                <ul class="flex space-x-6 text-slate-500 font-bold text-xs uppercase tracking-widest">
                    <li><a href="user_dashboard.html" class="hover:text-indigo-600 transition-colors">Fleet</a></li>
                    <li><a href="bookings.html" class="hover:text-indigo-600 transition-colors">Bookings</a></li>
                </ul>
                <button onclick="localStorage.clear(); window.location.href='login.html';"
                    class="w-10 h-10 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center hover:bg-rose-500 hover:text-white transition-all">
                    <i class="fas fa-power-off text-xs"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- 📝 Reservation Portal -->
    <div class="pt-32 pb-16 px-6 max-w-2xl mx-auto animate-fade-in">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">Reserve Your <span
                    class="text-indigo-600">Steed</span></h1>
            <p class="text-slate-500 font-medium">Finalize your premium rental experience</p>
        </div>

        <form id="bookingForm" class="glass p-10 md:p-12 rounded-[2.5rem] border-indigo-50 space-y-8 shadow-sm">
            <input type="hidden" id="carId" name="carId">

            <div class="bg-indigo-50/50 p-6 rounded-3xl border border-indigo-100 flex items-center space-x-4">
                <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-car-side text-indigo-500"></i>
                </div>
                <div>
                    <label class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Selected
                        Vehicle</label>
                    <input type="text" id="carName" name="carName"
                        class="bg-transparent border-none p-0 text-xl font-black text-indigo-900 focus:ring-0 w-full"
                        readonly>
                </div>
            </div>

            <!-- Profile Info (Static) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-1.5 opacity-60">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Renter
                        Identity</label>
                    <input type="text" id="fullName"
                        class="w-full px-5 py-3.5 bg-slate-100 border border-slate-200 rounded-2xl text-slate-500 font-bold outline-none"
                        readonly>
                </div>
                <div class="space-y-1.5 opacity-60">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Verified ID
                        No</label>
                    <input type="text" id="idNumber"
                        class="w-full px-5 py-3.5 bg-slate-100 border border-slate-200 rounded-2xl text-slate-500 font-bold outline-none"
                        readonly>
                </div>
            </div>

            <!-- Booking Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Commencement
                        Date</label>
                    <div class="relative">
                        <i class="fas fa-calendar-day absolute left-5 top-1/2 -translate-y-1/2 text-indigo-500"></i>
                        <input type="date" id="rentalDate" name="rentalDate" required
                            class="w-full pl-12 pr-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm font-semibold">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Lease Duration
                        (Days)</label>
                    <div class="relative">
                        <i class="fas fa-hourglass-half absolute left-5 top-1/2 -translate-y-1/2 text-indigo-500"></i>
                        <input type="number" id="rentalDays" name="rentalDays" placeholder="1-30" min="1" max="30"
                            required
                            class="w-full pl-12 pr-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm font-black">
                    </div>
                </div>
            </div>

            <!-- 💳 Payment Strategy -->
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest">Payment Strategy</h3>
                    <span class="px-2.5 py-1 bg-amber-50 text-amber-600 rounded-full text-[9px] font-black uppercase tracking-widest border border-amber-100">50% Upfront Required</span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="glass p-6 rounded-3xl border-indigo-100 bg-white shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Amount</p>
                        <p class="text-xl font-black text-slate-800">Ksh <span id="displayTotal">0</span></p>
                    </div>
                    <div class="glass p-6 rounded-3xl border-emerald-100 bg-emerald-50/30 shadow-sm">
                        <p class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1">Due Now (50%)</p>
                        <p class="text-xl font-black text-emerald-700">Ksh <span id="displayDeposit">0</span></p>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">M-Pesa Number</label>
                    <div class="relative">
                        <div class="absolute left-5 top-1/2 -translate-y-1/2 flex items-center space-x-2">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/M-PESA_LOGO-01.svg" class="w-6 h-4 object-contain">
                        </div>
                        <input type="tel" id="mpesaNumber" name="mpesaNumber" placeholder="07xxxxxxxx" required
                            class="w-full pl-16 pr-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm font-bold text-slate-700">
                    </div>
                </div>
            </div>

            <!-- Total Valuation (Removed old one) -->

            <button type="submit"
                class="w-full btn-premium py-5 rounded-[2rem] font-black shadow-xl shadow-indigo-100 active:scale-95 transition-all text-lg tracking-tight">
                Authorize & Pay Deposit <i class="fas fa-fingerprint ml-2 text-sm opacity-50"></i>
            </button>
        </form>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        const token = localStorage.getItem("token");

        if (!token || !user) {
            window.location.href = "login.html";
        }

        // Setup user info
        document.getElementById("fullName").value = `${user.firstName} ${user.lastName}`;
        document.getElementById("idNumber").value = user.idNumber;

        // Date constraints
        const today = new Date();
        const maxDate = new Date();
        maxDate.setDate(today.getDate() + 30);
        document.getElementById("rentalDate").min = today.toISOString().split("T")[0];
        document.getElementById("rentalDate").max = maxDate.toISOString().split("T")[0];

        // Fetch car details
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get("carId");
        let ratePerDay = 0;

        if (!carId) {
            Toast.error("Asset reference missing");
            setTimeout(() => window.location.href = "user_dashboard.html", 1500);
        } else {
            document.getElementById("carId").value = carId;
            fetchCarInfo(carId);
        }

        async function fetchCarInfo(id) {
            try {
                const response = await fetch(`/api/cars/${id}`);
                const car = await response.json();
                if (response.ok) {
                    document.getElementById("carName").value = car.carName;
                    ratePerDay = car.costPerDay;
                } else {
                    Toast.error("Failed to sync asset info");
                }
            } catch (error) {
                console.error("Sync Error:", error);
            }
        }

        // Live calculation
        document.getElementById("rentalDays").addEventListener("input", function () {
            const days = parseInt(this.value) || 0;
            const total = days * ratePerDay;
            const deposit = total * 0.5;
            document.getElementById("displayTotal").innerText = total.toLocaleString();
            document.getElementById("displayDeposit").innerText = deposit.toLocaleString();
        });

        

        

                // Submit Booking and Initiate STK Push
        document.getElementById("bookingForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const days = parseInt(document.getElementById("rentalDays").value);
            const totalCost = days * ratePerDay;
            const deposit = totalCost * 0.5;
            const mpesaNumber = document.getElementById("mpesaNumber").value;

            const payload = {
                carId,
                userId: user.id,
                carName: document.getElementById("carName").value,
                fullName: `${user.firstName} ${user.lastName}`,
                idNumber: user.idNumber,
                rentalDate: document.getElementById("rentalDate").value,
                rentalDays: days,
                cost: totalCost,
                depositPaid: deposit,
                paymentStatus: 'pending' // Initially pending until STK Push callback returns success
            };

            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Initializing Booking...';
                btn.disabled = true;

                // 1. Create the pending Booking Record
                const response = await fetch("/api/bookings", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const res = await response.json();
                    Toast.error(res.message || "Reservation failed");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    return;
                }

                const resData = await response.json();
                
                // 2. Trigger Real M-Pesa STK Push
                btn.innerHTML = '<i class="fas fa-mobile-alt fa-shake mr-2"></i> Sending Prompt to Phone...';
                
                const stkResponse = await fetch("/api/payment/stkpush", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        phone: mpesaNumber,
                        amount: deposit, 
                        accountReference: `RNTL-${resData.rentalId}`,
                        transactionDesc: `Deposit for vehicle ID ${carId}`
                    }),
                });

                if (stkResponse.ok) {
                    const stkData = await stkResponse.json();
                    const checkoutReqId = stkData.checkoutRequestId;

                    Toast.success("Prompt sent! Provide PIN on your phone.");
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Awaiting Approval...';

                    let pollAttempts = 0;
                    const pollInterval = setInterval(async () => {
                        pollAttempts++;
                        if (pollAttempts > 25) { // Timeout after 75s
                            clearInterval(pollInterval);
                            Toast.error("Request timed out or ignored. Pay later.");
                            window.location.href = "bookings.html";
                            return;
                        }

                        try {
                            const statusRes = await fetch(`/api/payment/status/${checkoutReqId}`, {
                                headers: { "Authorization": `Bearer ${token}` }
                            });
                            
                            if (statusRes.ok) {
                                const statusData = await statusRes.json();
                                if (statusData.status === 'paid') {
                                    clearInterval(pollInterval);
                                    Toast.success("Payment Received & Confirmed!");
                                    btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Verified';
                                    btn.classList.add('bg-emerald-500', 'text-white'); // Optional visual cue
                                    setTimeout(() => window.location.href = "bookings.html", 3000);
                                } else if (statusData.status === 'failed') {
                                    clearInterval(pollInterval);
                                    Toast.error("Payment Failed or Canceled.");
                                    btn.innerHTML = 'Complete Transaction';
                                    btn.disabled = false;
                                }
                            }
                        } catch(e) { console.error("Poll err:", e); }
                    }, 3000);

                } else {
                    const stkError = await stkResponse.json();
                    Toast.error(stkError.message || "Failed to send M-Pesa prompt.");
                    console.error("STK push error", stkError);
                    btn.innerHTML = 'Complete Transaction';
                    btn.disabled = false;
                }

            } catch (error) {
                Toast.error("Network error while communicating with server.");
                console.error(error);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
