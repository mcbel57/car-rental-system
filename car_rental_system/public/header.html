<!-- header.html -->
<header class="fixed top-0 left-0 w-full bg-blue-700 text-white shadow-md z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4">
            <!-- 🚗 Logo -->
            <a href="index.html" class="text-2xl font-bold">Car Rental System</a>

            <!-- 🛠️ Navigation Links -->
            <nav class="hidden md:flex space-x-6">
                <a href="index.html" class="hover:text-gray-200">Home</a>
                <a href="about.html" class="hover:text-gray-200">About Us</a>
                <a href="contact.html" class="hover:text-gray-200">Contact</a>

            <button id="menu-btn" class="md:hidden focus:outline-none">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
