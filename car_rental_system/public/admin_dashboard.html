<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Makbel Car Rentals Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 font-sans">

    <div class="flex min-h-screen">
        <!-- 🚀 Modern Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl fixed top-0 left-0 h-screen z-20 overflow-y-auto custom-scrollbar">
            <div class="p-8 flex items-center space-x-3 flex-shrink-0">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12 transition-transform hover:rotate-0">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Makbel Car Rentals <span class="text-indigo-500">HQ</span></h1>
            </div>

            
            <nav class="flex-1 px-4 space-y-1.5 mt-4 overflow-y-auto custom-scrollbar">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl bg-indigo-600/10 text-indigo-400 font-bold border border-indigo-500/20 transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management</div>
                <a href="admin_customers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-users text-lg"></i>
                    <span>Customer Directory</span>
                </a>
                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>


            <div class="p-6 flex-shrink-0">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center space-x-3 py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all border border-red-500/20 active:scale-95">
                    <i class="fas fa-link-slash"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- 🏢 Main Dashboard -->
        <main class="ml-72 flex-1 bg-slate-50 relative min-h-screen">
            <!-- Header -->
            <header
                class="sticky top-0 glass z-10 px-10 py-6 flex justify-between items-center border-b border-slate-200/50">
                <div class="animate-fade-in">
                    <h1 class="text-2xl font-black text-slate-800 tracking-tighter">Admin Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html"
                        class="text-sm font-bold text-slate-400 hover:text-indigo-600 transition-colors">View Website
                        <i class="fas fa-arrow-up-right-from-square ml-1 text-[10px]"></i></a>
                </div>
            </header>

            <div class="px-10 py-10 space-y-12 animate-fade-in">
                <!-- 📊 Stats Overview -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div
                        class="glass p-8 rounded-[2rem] border-indigo-50 shadow-sm transition-all hover:shadow-xl group">
                        <div
                            class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mb-6 transition-transform group-hover:scale-110">
                            <i class="fas fa-car text-xl"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Fleet</p>
                        <h4 class="text-3xl font-black text-slate-800 tracking-tighter" id="totalCars">--</h4>
                    </div>
                    <div
                        class="glass p-8 rounded-[2rem] border-violet-50 shadow-sm transition-all hover:shadow-xl group">
                        <div
                            class="w-12 h-12 bg-violet-100 text-violet-600 rounded-2xl flex items-center justify-center mb-6 transition-transform group-hover:scale-110">
                            <i class="fas fa-calendar-check text-xl"></i>
                        </div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Active Rentals
                        </p>
                        <h4 class="text-3xl font-black text-slate-800 tracking-tighter" id="activeRentals">--</h4>
                    </div>
                </div>

                <!-- 📩 Customer Inquiries Feed -->
                <section class="mb-12">
                    <div class="flex items-center justify-between mb-8">
                        <h3 class="text-xl font-bold text-slate-800 tracking-tight">Recent Inquiries</h3>
                        <span id="inquiryCount" class="bg-indigo-600 text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow-lg shadow-indigo-100 italic">-- New</span>
                    </div>
                    <div id="inquiriesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Loading Skeletons -->
                        <div class="glass p-8 rounded-[2rem] animate-pulse h-40"></div>
                        <div class="glass p-8 rounded-[2rem] animate-pulse h-40"></div>
                    </div>
                </section>

                <!-- 🚀 Quick Action Command Center -->
                <section>
                    <h3 class="text-xl font-bold text-slate-800 mb-8 tracking-tight">Quick Actions</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <a href="admin_manage_cars.html"
                            class="glass group p-8 rounded-[2.5rem] border-blue-50 hover:border-blue-400 transition-all hover:-translate-y-2 shadow-sm hover:shadow-2xl">
                            <div
                                class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-blue-100 group-hover:rotate-12 transition-transform">
                                <i class="fas fa-plus text-2xl"></i>
                            </div>
                            <h4 class="text-2xl font-black text-slate-800 mb-2">Manage Fleet</h4>
                            <p class="text-slate-500 font-medium leading-relaxed">Expand the fleet with new premium
                                selections.</p>
                        </a>

                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            Toast.success("Session terminated safely");
            setTimeout(() => window.location.href = "login.html", 1000);
        });

        async function fetchDashboardData() {
            try {
                // 1. Fetch Stats
                const statsResponse = await fetch("/api/admin/stats", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (statsResponse.status === 401 || statsResponse.status === 403) {
                    localStorage.clear();
                    window.location.href = "login.html";
                    return;
                }

                if (statsResponse.ok) {
                    const stats = await statsResponse.json();
                    document.getElementById("totalCars").innerText = stats.totalCars || 0;
                    document.getElementById("activeRentals").innerText = stats.activeRentals || 0;
                }

                // 2. Fetch Inquiries
                const inquiryRes = await fetch("/api/inquiries", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (inquiryRes.ok) {
                    const inquiries = await inquiryRes.json();
                    renderInquiries(inquiries);
                }

            } catch (error) {
                console.error("Dashboard Sync Error:", error);
                Toast.error("Failed to sync dashboard data");
            }
        }

        function renderInquiries(inquiries) {
            const grid = document.getElementById("inquiriesGrid");
            const countBadge = document.getElementById("inquiryCount");
            
            if (inquiries.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 font-medium">No inquiries found.</div>`;
                countBadge.innerText = "0 New";
                return;
            }

            countBadge.innerText = `${inquiries.filter(i => i.status === 'new').length} New`;
            
            grid.innerHTML = inquiries.slice(0, 4).map(inv => `
                <div class="glass p-8 rounded-[2rem] border-slate-100 hover:border-indigo-200 transition-all group relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-black text-xs uppercase">${inv.fullName[0]}</div>
                            <div>
                                <h4 class="font-bold text-slate-800">${inv.fullName}</h4>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${inv.email}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 ${inv.status === 'new' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'} rounded-full text-[9px] font-black uppercase tracking-widest">${inv.status}</span>
                    </div>
                    <p class="text-sm text-slate-600 line-clamp-2 italic leading-relaxed">"${inv.message}"</p>
                    <div class="mt-6 flex justify-end">
                        <button class="text-[10px] font-black uppercase tracking-widest text-indigo-600 hover:text-indigo-800 transition-colors">Mark as Read <i class="fas fa-check ml-1"></i></button>
                    </div>
                </div>
            `).join("");
        }

        fetchDashboardData();
    </script>

</body>

</html>
