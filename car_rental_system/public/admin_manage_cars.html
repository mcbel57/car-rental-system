<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vehicle | Makbel Car Rentals Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modern.css">
    <script src="js/toast.js"></script>
</head>

<body class="bg-slate-50 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl relative z-20">
            <div class="p-8 flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg transform rotate-12">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Makbel Car Rentals <span class="text-indigo-500">HQ</span></h1>
            </div>

            
            <nav class="flex-1 px-4 space-y-1.5 mt-4 overflow-y-auto custom-scrollbar">
                <a href="admin_dashboard.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-th-large text-lg"></i>
                    <span>Overview</span>
                </a>
                <div class="pt-6 pb-2 px-4 uppercase text-[10px] font-black tracking-widest text-slate-500">Management</div>
                <a href="admin_customers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-users text-lg"></i>
                    <span>Customer Directory</span>
                </a>
                <a href="admin_drivers.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-user-tie text-lg"></i>
                    <span>Approved Drivers</span>
                </a>
                <a href="admin_driver_management.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-id-card text-lg"></i>
                    <span>Driver Vetting</span>
                </a>
                <a href="admin_cars.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl bg-indigo-600/10 text-indigo-400 font-bold border border-indigo-500/20 transition-all font-semibold">
                    <i class="fas fa-car-side text-lg"></i>
                    <span>Fleet Control</span>
                </a>
                <a href="admin_view_rentals.html"
                    class="flex items-center space-x-3 py-3.5 px-4 rounded-2xl text-slate-400 hover:bg-white/5 hover:text-white transition-all font-semibold">
                    <i class="fas fa-clock-rotate-left text-lg"></i>
                    <span>Rental History</span>
                </a>
            </nav>


            <div class="p-6">
                <button id="logoutBtn"
                    class="w-full flex items-center justify-center space-x-3 py-4 bg-red-500/10 text-red-400 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all border border-red-500/20 active:scale-95">
                    <i class="fas fa-link-slash"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- 🏁 Manage Vehicle Interface -->
        <main class="flex-1 overflow-y-auto bg-slate-50 relative">
            <header class="sticky top-0 glass z-10 px-10 py-6 border-b border-slate-200/50">
                <div class="animate-fade-in">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Expand <span
                            class="text-indigo-600">Inventory</span></h2>
                </div>
            </header>

            <div class="px-10 py-10 animate-fade-in">
                <div class="max-w-4xl mx-auto">
                    <form id="carForm" enctype="multipart/form-data"
                        class="glass p-12 rounded-[2.5rem] border-indigo-50 space-y-8 shadow-sm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Vehicle
                                    Identity</label>
                                <input type="text" name="carName" placeholder="e.g. Mercedes AMG G63" required
                                    class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Color
                                    Shade</label>
                                <input type="text" name="color" placeholder="Obsidian Black" required
                                    class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Technical
                                Specifications</label>
                            <textarea name="description" placeholder="V8 Biturbo, 577 HP, Premium Nappa Leather..."
                                required rows="3"
                                class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm"></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2">
                                <label
                                    class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Drivetrain</label>
                                <select name="vehicleType" required
                                    class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm font-semibold text-slate-700">
                                    <option value="AWD">AWD (Premium)</option>
                                    <option value="4WD">4WD (Extreme)</option>
                                    <option value="RWD">RWD (Performance)</option>
                                    <option value="FWD">FWD (Standard)</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Daily
                                    Rental (Ksh)</label>
                                <input type="number" name="hireCost" placeholder="15000" required
                                    class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Media
                                Assets</label>
                            <label
                                class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-200 rounded-[2rem] cursor-pointer hover:bg-slate-50 hover:border-indigo-300 transition-all">
                                <div class="flex flex-col items-center justify-center pt-2 pb-2">
                                    <i class="fas fa-cloud-arrow-up text-slate-400 text-2xl mb-2"></i>
                                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Upload Hi-Res
                                        Image</p>
                                </div>
                                <input type="file" name="image" accept="image/*" required class="hidden" />
                            </label>
                        </div>

                        <button type="submit"
                            class="w-full btn-premium py-5 rounded-[2rem] font-black shadow-xl shadow-indigo-100 active:scale-95 transition-all text-lg">
                            Authorize & Add to Fleet
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get('id');

        if (!token || !user || user.role !== "admin") {
            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            Toast.success("Session closed");
            setTimeout(() => window.location.href = "login.html", 1000);
        });

        // ✅ If editing, fetch car data
        if (carId) {
            document.querySelector('h2').innerHTML = 'Edit <span class="text-indigo-600">Inventory</span>';
            document.querySelector('button[type="submit"]').innerText = 'Update Vehicle';
            
            fetch(`/api/cars/${carId}`, {
                headers: { "Authorization": `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(car => {
                const form = document.getElementById('carForm');
                form.carName.value = car.carName;
                form.description.value = car.description;
                form.color.value = car.color;
                form.vehicleType.value = car.vehicleType;
                form.hireCost.value = car.costPerDay;
                
                // Image is optional for updates
                form.image.required = false;
            })
            .catch(err => {
                console.error("Error fetching car:", err);
                Toast.error("Failed to load vehicle data");
            });
        }

        document.getElementById("carForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const btn = this.querySelector('button[type="submit"]');
                const originalText = btn.innerText;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Processing...';
                btn.disabled = true;

                const url = carId ? `/api/cars/${carId}` : "/api/cars";
                const method = carId ? "PUT" : "POST";

                const response = await fetch(url, {
                    method: method,
                    headers: { "Authorization": `Bearer ${token}` },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || data.message || "Failed to process request");

                Toast.success(carId ? "Vehicle updated successfully!" : "Vehicle added successfully!");
                
                setTimeout(() => window.location.href = "admin_cars.html", 2000);

            } catch (error) {
                console.error("Submit Error:", error);
                Toast.error(error.message);
                const btn = this.querySelector('button[type="submit"]');
                btn.innerText = carId ? "Update Vehicle" : "Authorize & Add to Fleet";
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
